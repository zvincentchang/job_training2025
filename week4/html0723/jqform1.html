<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>jQuery html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
</head>

<body>
    <h1 id="h1">Hello World</h1>
    <form id="myForm" action="javascript:alert('Form Send')">
        姓氏: <input type="text" name="FirstName" value="Vinc" /> <br />
        名字: <input type="text" name="LastName" value="Lee" />
        <input type="submit" />
    </form>
    <div id="div1"></div>
    <script>
        function check2(evt) {
            //alert('check...');
            var str = $("form").serialize();
            //alert(str);
            $("#div1").load('http://localhost:8080/web0723/SerializeDemoServlet', str, function (result) {
                alert(result);
            });
            evt.preventDefault();
        }
        function check(evt) {
            $.ajax({
                url: 'http://localhost:8080/web0723/SerializeDemoServlet',
                type: 'get',
                dataType: 'text', // From Server return type
                contentType: 'application/x-www-form-urlencoded;charset=UTF-8', //Send to Server 
                data: $('#myForm').serialize(),
                success: function (result) {
                    alert(result); 
                    $("#div1").text(result);
                }
            });
            evt.preventDefault();
        }
        $("form").submit(check);     
    </script>

</body>

</html>
