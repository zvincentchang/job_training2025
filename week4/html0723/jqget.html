<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>jQuery html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
</head>

<body>
    <h1 id="h1">Hello World</h1>
    <form action="javascript:alert('Form Send')">
        姓氏: <input type="text" id="fn" value="Vinc" /> <br/>
        名字: <input type="text" id="ln" value="Lee" />
        <button id="b1">Submit</button>
    </form>
    <div id="div1"></div>
    <script>
       function check(evt){
          
          $.get('http://localhost:8080/web0723/SerializeDemoServlet',
                 {"FirstName":$("#fn").val(),"LastName":$("#ln").val()},
                 function(result,status){
                       $("#div1").text(result);
                });
          evt.preventDefault();
       }
       $("#b1").click(check); 
    </script>
   
</body>

</html>
