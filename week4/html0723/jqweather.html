<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>jQuery html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
</head>

<body>
    <h1 id="h1">Weather</h1>
    <button id="forecast">ForeCast</button>
    <button id="forecast2">氣象局 ForeCast</button>
    <table id="airQ" width="90%">

    </table>
    <script>
        $("#forecast").on("click", function () {
            $.ajax({
                method: 'GET',
                url: 'http://localhost:8080/web0723/air.json', //設定資料的網址
                dataType: "json", //設定回傳的資料格式
                success: onSuccess //設定當Ajax要求成功時所要執行的函式
            });
        });
        function onSuccess(data) {
            $("#airQ").empty();
            //建立表格的第㇐列
            var firstRow = $("<tr><th>地區</th><th>預報內容</th></tr>");
            $("#airQ").append(firstRow);
            //將取得的資料㇐㇐建立為表格的每㇐列
            $.each(data, function (i) {
                var row = $("<tr></tr>");
                var td1 = $("<td></td>").text(this.Area).appendTo(row);
                var td2 = $("<td></td>").text(this.Content).appendTo(row);
                $("#airQ").append(row);
            });
        } 
        $("#forecast2").on("click", function () {
            $.ajax({
                method: 'GET',
                url: 'https://data.moenv.gov.tw/api/v2/aqf_p_01?api_key=e8dd42e6-9b8b-43f8-991e-b3dee723a52d&limit=20&sort=publishtime%20desc&format=JSON&callback', //設定資料的網址
                dataType: "json", //設定回傳的資料格式
                success: onSuccess2 //設定當Ajax要求成功時所要執行的函式
            });
        });
        function onSuccess2(data) {
            $("#airQ").empty();
            //建立表格的第㇐列
            var firstRow = $("<tr><th>地區</th><th>預報內容</th></tr>");
            $("#airQ").append(firstRow);
            //將取得的資料㇐㇐建立為表格的每㇐列
            $.each(data.records, function (i) {
                var row = $("<tr></tr>");
                var td1 = $("<td></td>").text(this.area).appendTo(row);
                var td2 = $("<td></td>").text(this.content).appendTo(row);
                $("#airQ").append(row);
            });
        } 
    </script>

</body>

</html>
