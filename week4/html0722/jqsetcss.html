<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>jQuery html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
</head>

<body>
    <h1 id="h1">Hello World</h1>
    <h2>Hello Set Multiple CSS</h2>
    <button id="b1">Set Css</button>
    <script> 
       $("#b1").click(function(){
          $("h2").css({"font-size":"24px","background-color":"red"});
       });   
    </script>

</body>

</html>
