<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>jQuery html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <style>
        div {
            margin: 10px;
            padding: 12px;
            border: 2px solid #666;
            width: 60px;
            height: 60px;
            cursor: pointer
        }
    </style>
</head>

<body>
    <h1 id="h1">Hello World</h1>
    <div>One</div>
    <div>Two</div>
  
    <script>
        $("div").mouseenter(function () {
            console.log('Cursor is in!');
        });
        $("div").mouseleave(function () {
            console.log('Cursor is out!');
        });
        $("div").click(function (eventObj) {
            console.log('Event type is ' + eventObj.type);
            console.log('pageX : ' + eventObj.pageX);
            console.log('pageY : ' + eventObj.pageY);
            console.log('Target : ' + eventObj.target.innerHTML);
        });

    </script>

</body>

</html>
