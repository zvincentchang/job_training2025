<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jQuery Serialize</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
<!-- jQuery library -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

<!-- Latest compiled JavaScript -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
    <button id="b1">Get Json</button>
    <div class="row">
        <div class="col-md-3">
            <div class="card" style="width:100%">
                <img class="card-img-top" style="height:300px" id="pic1" src="./images/pic.png" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title" id="title1">John Doe</h4>
                    <p class="card-text" id="desc1">Some example text.</p>
                    <a href="#" class="btn btn-primary">See Profile</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card" style="width:100%">
                <img class="card-img-top" style="height:300px" id="pic2" src="./images/pic.png" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title" id="title2">John Doe</h4>
                    <p class="card-text" id="desc2">Some example text.</p>
                    <a href="#" class="btn btn-primary">See Profile</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card" style="width:100%">
                <img class="card-img-top" style="height:300px" id="pic3" src="./images/pic.png" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title" id="title3">John Doe</h4>
                    <p class="card-text" id="desc3">Some example text.</p>
                    <a href="#" class="btn btn-primary">See Profile</a>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card" style="width:100%">
                <img class="card-img-top" style="height:300px" id="pic4" src="./images/pic.png" alt="Card image">
                <div class="card-body">
                    <h4 class="card-title" id="title4">John Doe</h4>
                    <p class="card-text" id="desc4">Some example text.</p>
                    <a href="#" class="btn btn-primary">See Profile</a>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
    <p></p>
    <ul class="pagination" id="pg">
        <li class="page-item"><a class="page-link" href="#">Previous</a></li>
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item active"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item"><a class="page-link" href="#">Next</a></li>
    </ul>
</div>
</div>  
<script>
   var pageCount=4;
   var products=[];
   function showCard(data,page) {
      $("#pic1").attr("src",data[page*pageCount].image);
      $("#pic2").attr("src",data[page*pageCount+1].image);
      $("#pic3").attr("src",data[page*pageCount+2].image);
      $("#pic4").attr("src",data[page*pageCount+3].image);
      displayPage(data,page)
      
   }
   function  displayPage(data,page){      
      $("#pg").empty();
      var size=data.length;      
      console.log("size:"+size);
      for (var i = 0; i < Math.ceil(size/pageCount); i++) { 
         //creating the page items
         if(i==page)
           $("#pg").append('<li class="page-item active"><a class="page-link" onclick="showCard(products,'+i+')">' + (i + 1) + '</a></li> ');
         else
           $("#pg").append('<li class="page-item"><a class="page-link" onclick="showCard(products,'+i+')">' + (i + 1) + '</a></li> ');
     
      }
   }
   
   function result(data){
      products=data;      
      showCard(data,0);     
   }
   function check(evt){	   
	   $.get("https://fakestoreapi.com/products",result);
	   evt.preventDefault();
   }
   function start(){
	  $("#b1").click(check);
   }
   $(document).ready(start);
</script>
</body>
</html>
