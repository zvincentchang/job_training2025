<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>First html</title>
   
</head>
<body>
    <h1>Hello World</h1>
    <button onclick="person()">Person</button>
    <button onclick="person2()">Person 2</button>
    <button onclick="person3()">Person Array</button>
   <script>
      var person=function(){
           var p={"name":"Mary","age":20};
           console.log(p.name);
           console.log(p.age);
      };
      function person2(){
        var p2={};
        n=prompt('input name:');
        p2.name=n;
        a=prompt('input age:');
        p2.age=parseInt(a);
        console.log(p2);

      }
      function person3(){
          var parry=[{"name":"Mary","age":20},{"name":"John","age":22}];
          for(var i=0;i<parry.length;i++){
            console.log(parry[i].name+"->"+parry[i].age);
          }
          parry.forEach((item,index) => console.log(index+":"+item.name+":"+item.age));
      }
   </script>
</body>
</html>
