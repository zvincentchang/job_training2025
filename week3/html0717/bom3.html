<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Clock</title>   
</head>
<body>
    <h1>Hello World</h1>
    <div id="timer">00:00:00</div>
    <button onclick="start()">start</button>
    <button onclick="cleartimer()">stop</button>
    <script>
       var tid;
       function showTime(){
         var div=document.getElementById("timer");
         var date=new Date();
         div.innerHTML="<h2>"+ date.toLocaleTimeString() +"</h2>";
       }
       function start(){
          tid=window.setInterval(showTime,1000);
       }
       function cleartimer(){
          window.clearInterval(tid);
       }
    </script>
</body>
</html>
