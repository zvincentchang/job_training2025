<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>First html</title>    
</head>
<body>
    <h1>Hello World</h1>
    <button onclick="execute()">js Array</button>
    <button onclick="remove()">js Array delete</button>
    <button onclick="search()">js Array Search</button>
    <script>
        var arry=[6,7,8];
        function execute(){
           arry.push(1);
           arry.push(2);
           arry.push(3);
           for(var i=0; i< arry.length;i++)
           {
             console.log("index:"+i+"->"+arry[i]);
           }
        }
        function remove(){
            //var last=arry.pop();
            var first=arry.shift();
            console.log("delete element:"+first);
            console.log("remain:"+arry);
        }
        function search(){
            console.log(arry);
            n=prompt('search value');
            i=arry.indexOf(parseInt(n));
            alert(i);
        }
    </script>
</body>
</html>
