<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>json html</title>    
</head>
<body>
    <h1>Hello World</h1>
    <p>p1</p>
    <p>p2</p>
    <p>p3</p>
    <button onclick="execute()">get all p tag</button>
    <script>
        function execute(){
            var ptags=document.getElementsByTagName('p');
            //console.log(typeof ptags);
            for(var i=0;i<ptags.length;i++){
                var obj=ptags[i];
                //obj.innerText="paragraph "+(i+1);
                obj.innerHTML="<h2 style='color:blue'>paragraph "+(i+1)+"</h2>";
            }
        }
    </script>
      
</body>
</html>
