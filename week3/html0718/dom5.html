<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>json html</title>
</head>

<body>
    <h1>Hello World</h1>
    <ol id="firstUL"></ol>
    <button onclick="execute()">add child</button>
    <script>
        function execute() {
            var head = document.getElementById('firstUL');
            for (var i = 1; i <= 3; i++) {
                li01 = document.createElement("li");
                li01.innerHTML = "<p style='color:red'>顯示的文字" + i+"</p>";
                head.appendChild(li01);
            }
        }
    </script>

</body>

</html>
