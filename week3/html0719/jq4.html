<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>dom html</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <style>
        .intro{
            color:brown;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <h2>Hello World 1</h2>
    <h2>Hello World 2</h2>
    <h2>Hello World 3</h2>
    <p>p1</p>
    <p>p2</p>
    <button id="b1">chang h2 color</button>
    <button id="b2">show</button>
    
    <script>
       function changeColor(){
          $("h2").each(function(){
              this.style.color='blue';
          });
       }
       function changePColor(){
          $("p").addClass('intro');
       }

       function start(){         
         $("#b1").click(changeColor);
         $("#b2").click(changePColor);
        }      

       $(document).ready(start);
    </script>

</body>

</html>
