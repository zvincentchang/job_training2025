<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>First js html</title>
    <style>
    </style>
</head>

<body>
    <script>
        var count=0;
        var value=parseInt(Math.random()*100+1);
        //alert(value);
        function guess(){
            count++;
            var n=prompt('guess 1~100');
            while(n!=value){
                if(n>value)
                  alert('input too big');
                else if(n<value)
                  alert('input too small');
                n=prompt('guess 1~100');
                count++;
            }
            alert("猜對了 猜的次數:"+count);
        }
    </script>
   
 <button onclick="guess()">Guess</button>
</body>

</html>
