<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>UL Child</title>
    <script type="text/javascript">
        function add(){
            var ULHead=document.getElementById("firstUL");
            for(var i=1;i<=5;i++){
                var liTag=document.createElement("li");
                //liTag.innerHTML="<h3 style='color:blue'>顯示文字 "+i+"</h3>";
                liTag.innerText = "<h3 style='color:blue'>顯示文字 " + i + "</h3>";
                ULHead.appendChild(liTag);
            }
        }
    </script>
</head>

<body>  
    
    <button onclick="add()">Add UL Child</button><p></p>
    <ol id="firstUL"></ol>
    
</body>

</html>
