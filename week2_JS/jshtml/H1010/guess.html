<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>
    <style></style>
</head>
<body>
    <script>
        var rnd=parseInt(Math.random()*100);
        var guess=0;
        while(rnd != guess){
           guess= prompt("Guess 1~100:");
           if(guess>rnd)
             alert(guess+" too big");
            else if(guess<rnd)
              alert(guess + " too small");
            else{
                alert("Bingo");
                break;
            }
        }
    </script>
</body>

</html>
