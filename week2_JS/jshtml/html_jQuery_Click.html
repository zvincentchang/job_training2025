<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>First jQuery Test</title>
    <script src="js/jquery3.6.0.js"></script>
</head>

<body>
    <h1>jQuery Test</h1>
    <div id="div1" style="width:200px;height:120px;background-color: aqua;">Hello</div>
    <script>
        function changeColor(){
           $("#div1").css('background-color','yellow'); 
        }
        function start() {
           $("#div1").click(changeColor); 
        }
        $(document).ready(start);
    </script>
</body>

</html>
