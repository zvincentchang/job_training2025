<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>UL Child</title>
    <script type="text/javascript">
        function changeCSS(){
            var foo=document.getElementById("foo");
            foo.style.color="yellow";
            foo.style.background="#0f0";
        }  
    </script>
</head>
     
<body>

    <button onclick="changeCSS()">Change Style</button>
    <p id="foo">Hello World</p>
    

</body>

</html>
