<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>UL Child</title>
    <style>
        #foo{
             position: absolute;
             left: 100px;
             top: 50px;
             height: 100px;
             border: 1;
        }

    </style>
    <script type="text/javascript">
        function changeCssProperty() {
           var div=document.getElementById("foo");
           alert(div.currentStyle.top);
        }  
    </script>
</head>

<body>
    <div id="foo" style="top:200px">Hello World</div>
    <button onclick="changeCssProperty()">Change Style Property</button>
    


</body>

</html>
