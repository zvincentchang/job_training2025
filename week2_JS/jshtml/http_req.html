<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>XMLHttpRequest</title>
</head>

<body>
<div id="user">Display User name</div>
<button onclick="execute()">Async Execute()</button>
<script>
  function execute(){  
    // 建立 XMLHttpRequest 物件
    var httpRequest;
    httpRequest = new XMLHttpRequest();
    // AJAX callback
    httpRequest.onreadystatechange = function () {
        // 等狀態變成請求完成狀態
        if (httpRequest.readyState === 4) {
            // 只處理 server 返回正常的 HTTP 200 狀態
            if (httpRequest.status == 200) {
                // 解開 server 返回的 JSON 資料格式
                var jsonResponse = JSON.parse(httpRequest.responseText);
                // 更新頁面內容
                document.getElementById('user').innerHTML = jsonResponse.userName;
            } else {
                alert('ERROR - server status code: ' + httpRequest.status);
            }
        }
    };
    // 使用 HTTP GET 方法，從 URL {username:’Mary’}請求資料
    httpRequest.open('GET', 'user.txt');
    // 送出 HTTP 請求
    httpRequest.send();
}
</script>
</body>
</html>
