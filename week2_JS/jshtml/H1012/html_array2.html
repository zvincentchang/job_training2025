<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Javascript Function</title>

</head>

<body>
    <h1>Javascript Function</h1>
    <script>
        var fruits = ['Apple', 'Banana','Cherry','Grape','Lemon'];
        function start() {
            var str="";
            for(var i=0;i<fruits.length;i++){
               var f =fruits[i];
               str=str+f+" | ";
            }
            alert(str);
        }
      
    </script>
    <button onclick="start()">Read Array</button>
    
</body>

</html>
