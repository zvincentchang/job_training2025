<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>First HTML</title>
    <style>
        .red_text{
            color:red;
        }
        .size36{
            font-size: 36px;
        }
        #head3{
            color:blue;
        }
        h4,p{
            color:brown;
            font-size:large;
        }
    </style>
</head>

<body>
    <h1 class="red_text">First HTML</h1>
    <h2 class="size36 red_text">size36 red_text</h2>
    <h3 id="head3">First HTML</h3>
    <h4>Heading 4</h4>
    <p>This is line text</p>
</body>

</html>
