<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>setInterval</title>
</head>

<body>
    <button onclick="start()">start time</button>
    <button onclick="stop()">stop time</button>
    <div id="mytime"></div>
    <script>
        var id;
        function getTime(){
          var div= document.getElementById("mytime");
          var t=new Date();
          div.innerText=t.toLocaleTimeString();
        }
        function start() {
           id= setInterval(getTime, 1000);
        }
        function stop(){
            clearInterval(id);
        }
    </script>
</body>

</html>
