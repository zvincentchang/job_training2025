<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DIM HTML</title>
</head>

<body>
   <div id="div1">
       <p>paragraph 1</p>
       <p>paragraph 2</p>
       <p>paragraph 3</p>
       <p>paragraph 4</p>
       <p>paragraph 5</p>
       <p>paragraph 6</p>
   </div>
<div id="div2">
    <p>div1 p1</p>
    <p>div2 p2</p>
    
</div>
   <button onclick="countp()">Count &lt;p&gt; length</button>
</body>
<script>
    function countp(){
        var div1=document.getElementById("div2");
        var tagName=div1.getElementsByTagName("p");
        //alert(tagName.length);
        for(var i=0;i<tagName.length;i++)
           alert(tagName[i].innerText);
    }
</script>
</html>
