<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>onclick with arg </title>

    <script type="text/javascript">
        function showAttr(arg) {
            var value = arg.getAttribute("data-name");
            alert('Hello '+value); 
        }  
    </script>
</head>

<body>
    <button onclick="showAttr(this)" data-name="Mike">get this attr</button>
    

<script>
      function setColor(evt){
         evt.target.style.background = 'yellow';
      }
      //document.body.addEventListener('click',setColor);
      document.addEventListener('click', setColor);
          // 當網頁載入時，執行這個 callback 函數
      window.addEventListener('load', function () {
                alert('頁面已載入！');
      });

</script>


</body>

</html>
