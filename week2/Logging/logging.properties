# logging.properties for LogPropertiesDemo
name=LogPropertiesDemo

# root logger level and handlers
.level = INFO
handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# ConsoleHandler ö
java.util.logging.ConsoleHandler.level = FINE
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# FileHandler â
java.util.logging.FileHandler.level = INFO
# pattern ölogs/app%u.%g.log
java.util.logging.FileHandler.pattern = logs/app%u.%g.log
java.util.logging.FileHandler.limit = 5000000       
java.util.logging.FileHandler.count = 3             áè
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.formatter = CustomFormatter