<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      document.write("E的值為" + Math.E + "<br>");
      document.write("LN2的值為" + Math.LN2 + "<br>");
      document.write("LN10的值為" + Math.LN10 + "<br>");
      document.write("LOG2E的值為" + Math.LOG2E + "<br>");
      document.write("LOG10E的值為" + Math.LOG10E + "<br>");
      document.write("PI的值為" + Math.PI + "<br>");
      document.write("SQRT1_2的值為" + Math.SQRT1_2 + "<br>");
      document.write("SQRT2的值為" + Math.SQRT2 + "<br>");
      document.write("-100的絕對值為" + Math.abs(-100) + "<br>");
      document.write("5和25的較大值為" + Math.max(5, 25) + "<br>");
      document.write("5和25的較小值為" + Math.min(5, 25) + "<br>");
      document.write("2的10次方為" + Math.pow(2, 10) + "<br>");
      document.write("1.56的四捨五入值為" + Math.round(1.56) + "<br>");
      document.write("2的平方根為" + Math.sqrt(2) + "<br>");
    </script>
  </head>
</html>
