<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var X = new String("JavaScript");      
      document.write("big(): " + X.big() + "<br>");      
      document.write("bold(): " + X.bold() + "<br>");
      document.write("fixed(): " + X.fixed() + "<br>");
      document.write("fontcolor('red'): " + X.fontcolor("red") + "<br>");
      document.write("fontsize(7): " + X.fontsize(7) + "<br>");
      document.write("italics(): " + X.italics() + "<br>");
      document.write("link('https://developer.mozilla.org'): " + X.link("https://developer.mozilla.org") + "<br>");
      document.write("small(): " + X.small() + "<br>");
      document.write("strike(): " + X.strike() + "<br>");
      document.write("sub(): " + X.sub() + "<br>");
      document.write("sup(): " + X.sup() + "<br>");
	  document.write(X + "轉換為全部小寫得到" + X.toLowerCase() + "<br>");
	  document.write(X + "轉換為全部大寫得到" + X.toUpperCase() + "<br>");
    </script>
  </head>
</html>
