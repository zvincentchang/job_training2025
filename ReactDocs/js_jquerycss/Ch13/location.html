<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      for(var property in window.location)
        document.write(property + ":" + window.location[property] + "<br>");
    </script>
  </head>
  <body>
    <input type="button" value="重新載入" 
      onclick="javascript: window.location.reload();">
    <input type="button" value="導向到Google台灣" 
      onclick="javascript :window.location.replace('https://www.google.com.tw/');">
  </body>
</html>
