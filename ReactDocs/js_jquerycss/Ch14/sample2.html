<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var msg = "歡迎光臨快樂小站﹗　　　　　　　　　　　　　　　　";
      var interval = 200;      
      var index = 0;
      function marquee() {
        document.myForm.myText.value = msg.substring(index, msg.length)
           + msg.substring(0, msg.length);
        index++;       
        if (index > msg.length) index = 0;
        window.setTimeout("marquee();", interval);
      }
    </script>
  </head>
  <body onload="javascript: marquee();">
    <form name="myForm">
      <input type="text" name="myText" size="30">
    </form>
  </body>
</html>
