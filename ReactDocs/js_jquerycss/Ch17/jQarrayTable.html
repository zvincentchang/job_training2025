<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <title>產品表格</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <table id="product" rules="rows" width="40%" border="1"></table>
    <script>
        var arr = [{ "name": "Apple", "price": 60 }, { "name": "Lemon", "price": 90 }, { "name": "Cherry", "price": 300 }];
        $("#product").empty();
        //建立表格的第一列
        var firstRow = $("<tr style='text-align: left;'><th>Row</th><th>產品名稱</th><th>產品價格</th></tr>");
        $("#product").append(firstRow);
        //將取得的資料一一建立為表格的每一列
        $.each(arr, function (i) {
            var row = $("<tr></tr>");
            $("<td></td>").text(i + 1).appendTo(row);
            $("<td></td>").text(this.name).appendTo(row);
            $("<td></td>").text(this.price).appendTo(row);
            $("#product").append(row);
        });
    </script>

</body>

</html>
