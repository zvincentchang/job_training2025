<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <title>jQuery Template</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
</head>
<body> 
    <button onclick="addForm()">Get Add Employee Form</button> <button onclick="saveform()">Save Employee Form</button>
    <button onclick="send()">Get All Employees</button>
    <button onclick="getJson()">Get All JSON Employees</button>   
    <button onclick="updateEmployee()">Update Employees</button><p>
    <span id="msg">employees data</span>
    <table id="emp" width="95%">
<script>   
    function result(data,status){
       // alert(status);     
       $("#msg").show();  
        $("#msg").html(data);
    }
    function saveform(){
        $.ajax({
            url : 'http://localhost:8080/mvweb0120/EmpAddController' ,
            type : 'post', 
            dataType : 'json',  // From Server returns
            contentType : 'application/x-www-form-urlencoded;charset=UTF-8' , //Send to Server 
            data : $("#addEmpForm").serialize(), 
            success : jsonresult
        });
    	
        $("#msg").hide();
    }
    function addForm(){
        $.ajax({
                url : 'http://localhost:8080/mvweb0120/addemployee.jsp' ,
                type : 'get', 
                dataType : 'html',  // From Server returns
                contentType : 'application/json;charset=UTF-8', //Send to Server 
                data : "", 
                success : result
        });
    }
    function updateEmployee(){  
    	
    	$.ajax({
            url : 'http://localhost:8080/mvweb0120/EmpUpdateController' ,
            type : 'post', 
            dataType : 'json',  // From Server returns
            contentType : 'application/x-www-form-urlencoded;charset=UTF-8' , //Send to Server 
            data : $("#myform1").serialize(), 
            success : jsonresult
        });
    	
        $("#msg").hide();
    }
    function getDeleteForm(event){
       //alert(event.value);
       $.ajax({
                url : event.value ,
                type : 'get', 
                dataType : 'json',  // From Server returns
                contentType : 'application/json;charset=UTF-8', //Send to Server 
                data : "", 
                success : jsonresult
        });
      
    }
    function getUpdateForm(event){
       //alert(event.value);
       $.ajax({
                url : event.value ,
                type : 'get', 
                dataType : 'html',  // From Server returns
                contentType : 'application/json;charset=UTF-8', //Send to Server 
                data : "", 
                success : result
        });
      
    }
    function jsonresult(data,status){
        $("#emp").attr("width","95%");
        $("#emp").attr("border","1");
                $("#emp").empty();
                //建立表格的第一列
                var firstRow = $("<tr><th>員工編號</th><th>員工名字</th><th>員工姓氏</th><th>郵件</th><th>職稱</th><th>操作</th></tr>");
                $("#emp").append(firstRow);
                //將取得的資料一一建立為表格的每一列
          $.each(data, function (i) {
                    var row = $("<tr></tr>");
                    var td1 = $("<td></td>").text(this.employeeNumber).appendTo(row);
                    var td2 = $("<td></td>").text(this.firstName).appendTo(row);
                    var td3 = $("<td></td>").text(this.lastName).appendTo(row);
                    var td4 = $("<td></td>").text(this.email).appendTo(row);
                    var td5 = $("<td></td>").text(this.jobTitle).appendTo(row);
                    var action="<button value='http://localhost:8080/mvweb0120/UpdateFormServlet?no="+this.employeeNumber+"' onclick='getUpdateForm(this)'>修改</button>"
                    action+=" <button value='http://localhost:8080/mvweb0120/DeleteEmployeeServlet?no="+this.employeeNumber+"' onclick='getDeleteForm(this)'>刪除</button>"
                    var td5 = $("<td></td>").html(action).appendTo(row);
                    $("#emp").append(row);
          });
        
    }
    function send(){        
        $.ajax({
                url : 'http://localhost:8080/mvweb0120/employees' ,
                type : 'get', 
                dataType : 'html',  // From Server returns
                contentType : 'application/json;charset=UTF-8', //Send to Server 
                data : "", 
                success : result
        });
       
    }   
    function getJson(){        
        $.ajax({
                url : 'http://localhost:8080/mvweb0120/jsonemployees' ,
                type : 'get', 
                dataType : 'json',  // From Server returns
                contentType : 'application/json;charset=UTF-8', //Send to Server 
                data : "", 
                success : jsonresult
        });
       
    }   
</script>
</body>
</html>
