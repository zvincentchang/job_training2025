<!DOCTYPE html>
<html>

<head>
    <title>jQuery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body>
    <h1>Hello jQuery</h1>
    <button onclick="change()">change picture</button><br/><br/>
    <img src="../day1224/images/img1.jpg" id="pic1" width="480" height="300"/>
    <script>
       var imgArray=["../day1224/images/img1.jpg","../day1224/images/img2.jpg","../day1224/images/img3.jpg","../day1224/images/img4.jpg"];
       var index=0;
       function change(){
          index++;
          if(index>=imgArray.length)
            index=0;
          $("#pic1").attr("src",imgArray[index]);
       }
    </script>
</body>

</html>
