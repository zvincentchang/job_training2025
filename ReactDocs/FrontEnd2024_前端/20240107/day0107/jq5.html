<!DOCTYPE html>
<html>

<head>
    <title>jQuery</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>

<body>
    <h1>Hello jQuery</h1>
    <button onclick="create()">create table</button>
    <table id="product" width="50%"></table>
    <script>
        function create() {
            $("#product").attr("border","1");
            var arr = [{ "name": "Apple", "price": 60 }, { "name": "Lemon", "price": 90 },
                       { "name": "Cherry", "price": 300 }];

            $.each(arr, function (i) {
                var row = $("<tr></tr>");
                $("<td></td>").text(i + 1).appendTo(row);
                $("<td></td>").text(this.name).appendTo(row);
                $("<td></td>").text(this.price).appendTo(row);
                $("#product").append(row);

            })
        }
    </script>
</body>

</html>
