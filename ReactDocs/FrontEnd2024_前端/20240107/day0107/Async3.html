<!DOCTYPE html>
<html>

<head>
    <title>Async Submit</title>
    <style>
    </style>
</head>

<body>
    <h1>Hello</h1>
    <h2>       
        <div id="user"></div>
    </h2>
    <script>
        var data = "fname=John&lname=Lee";
        // 建立 XMLHttpRequest 物件
        var httpRequest;
        httpRequest = new XMLHttpRequest();       

        // AJAX callback
        httpRequest.onreadystatechange = function () {
            // 等狀態變成請求完成狀態
            if (httpRequest.readyState === 4) {
                // 只處理 server 返回正常的 HTTP 200 狀態
                if (httpRequest.status == 200) {                    
                    // 更新頁面內容
                    document.getElementById('user').innerHTML = httpRequest.responseText;
                } else {
                    alert('ERROR - server status code: ' + httpRequest.status);
                }
            }
        };
        // 使用 HTTP GET 方法，從 URL {username:’Mary’}請求資料
        httpRequest.open('POST', 'http://localhost:8080/mvweb0107/user.jsp');
        // 送出 HTTP 請求
        httpRequest.setRequestHeader("Content-Type",
                              "application/x-www-form-urlencoded");
        httpRequest.send(data);

    </script>
</body>

</html>
