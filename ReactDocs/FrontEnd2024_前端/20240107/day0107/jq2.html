<!DOCTYPE html>
<html>
    <head>
        <title>jQuery</title> 
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    </head>
    <body>
        <button onclick="show()">show p1</button>
        <p id="p1">Hello jQuery</p>       
       
        <script>
           function show(){
              $("#p1").show();
           }
           function hide(){
            $("#p1").hide();
           } 
           function start(){
              $("#p1").click(hide);
           } 
           $(document).ready(function(){
                 start();
           });
        </script>
    </body>
</html>
