<!DOCTYPE html>
<html>
    <head>
        <title>setInterval demo</title>        
        <style>          
        </style>
    </head>
    <body>
        <h1>Hello</h1>
        <button onclick="start()">start</button>
        <button onclick="stopTime()">stop</button>
        <script>
            var id;
            function displayAlert(){
                alert('5 seconds');
            }
            function start(){
               id=setInterval(displayAlert,5000);
            }
            function stopTime(){
                window.clearInterval(id);
            }
        </script>
    </body>
</html>
