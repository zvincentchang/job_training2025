<!DOCTYPE html>
<html lang="zh-tw">
<head>
    <meta charset="utf-8">
    <title>jQuery Template</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
</head>
<body>
    <form action="javascript:alert('client submit')">
        姓氏: <input type="text" id="firstName" name="firstName" value="Vinc" /><br/>
        名字: <input type="text" id="lastName"  name="lastName" value="Lee" /><br/>
        <input type="submit"/>
    </form>
    <span id="msg"></span>
<script>   
    function result(data,status){
        alert(status);
        $("#msg").text(data);
    }
    function send(event){
       var strs= $("form").serialize();
       alert(strs);
       //$.get("http://localhost:8080/names?"+strs,result);
       $.post("http://localhost:8080/names",{"firstName":$("#firstName").val(),"lastName":$("#lastName").val()},result);
       event.preventDefault();
    }
    function start(){
        $("form").submit(send);
    }
    $(document).ready(start);
</script>
</body>
</html>
