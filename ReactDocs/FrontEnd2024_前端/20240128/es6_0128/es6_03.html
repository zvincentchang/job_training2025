<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="utf-8">
    <title>ES6 Javascript</title>
</head>

<body>
    <button onclick="test()">test</button>
    <script>
        function test() {
            const A = 10;

            // 會發生錯誤，常數值不能再被改變
            // TypeError: Assignment to constant variable
            //A = 10;

            // 陣列是一個有趣的例子
            const ARR = [1, 2];

            // 可以改變陣列裡的內容
            // 因為 ARR 變數值沒有改變，還是指向同一個陣列
            ARR.push(3);

            // [1, 2, 3]
            console.log(ARR);

        }

    </script>
</body>

</html>
