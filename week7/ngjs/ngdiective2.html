<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script src="https://cdn.staticfile.org/angular.js/1.8.1/angular.min.js"></script>
</head>

<body>

    <div ng-app="myApp">
        <code-directive>Hello</code-directive>
        <div code-directive></div>
        <div class="hello-test"></div>
        <script>
            var app = angular.module("myApp", []);
            app.directive("codeDirective", function () {
                return {
                    restrict: "A",
                    template: "<h1>Attribute 自定義指令!</h1>"
                };
            });
            app.directive("helloTest", function () {
                return {
                    restrict: "C",
                    template: "<h1>Class 自定義指令!</h1>"
                };
            });
        </script>

    </div>

</body>

</html>
