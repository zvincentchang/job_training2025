<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>jQuery Users</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">       
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script> 
    <script src="./js/jquery.3.6.3.min.js"></script>     
    <script src="./js/bootstrap.min.js"></script>
    <style>
        .carousel-inner img {
            height: 32rem;
            width: auto;           
        }
    </style>
    <div class="container">
     <div id="ExampleIndicators" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
            <li data-target="#ExampleIndicators" data-slide-to="0" class="active"></li>
            <li data-target="#ExampleIndicators" data-slide-to="1"></li>
            <li data-target="#ExampleIndicators" data-slide-to="2"></li>         
        </ol>

        <div class="carousel-inner">
            <div class="carousel-item active" data-interval="3000">
                <div class="carousel-caption">
                    <h5 style="color:brown">First slide label</h5>
                </div>
                <img src="./images/img8.jpg" class="d-block w-100" alt="banner 1" />
            </div>
            <div class="carousel-item" data-interval="3000">
                <div class="carousel-caption">
                    <h5 style="color:brown">Second slide label</h5>
                </div>
                <img src="./images/img10.jpg" class="d-block w-100" alt="banner 2" />
            </div>
            <div class="carousel-item" data-interval="3000">
                <div class="carousel-caption">
                    <h5 style="color:brown">Third slide label</h5>
                </div>
                <img src="./images/img11.jpg" class="d-block w-100" alt="banner 3" />
            </div>           
        </div>
        <a class="carousel-control-prev" href="#ExampleIndicators" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#ExampleIndicators" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>

   
    
</head>

<body>
    <div class="container">     
          

    </div>
</body>

</html>
