<html><head>
    <title>Spring MVC表單處理</title>
</head>
<body>

<h2>Student Information</h2>
<form id="command" action="addStudent" method="POST">
   <table>
    <tbody><tr>
        <td><label for="name">名字：</label></td>
        <td><input  name="name" type="text" value="Alan"></td>
    </tr>
    <tr>
        <td><label for="age">年齡：</label></td>
        <td><input name="age" type="text" value="20"></td>
    </tr>
    <tr>
        <td><label for="id">編號：</label></td>
        <td><input name="id" type="text" value="1"></td>
    </tr>
    <tr>
        <td colspan="2">
            <input type="submit" value="提交表單">
        </td>
    </tr>
</tbody></table>  
</form>


</body></html>
