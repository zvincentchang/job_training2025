<!DOCTYPE html>
<html>
    <head>
       <meta charset="utf-8">
       <title>Bootstrap Html</title>
       <link rel="stylesheet" href="./css/bootstrap.min.css">
       <script src="./js/bootstrap.min.js"></script>
       <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
       <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>       
    </head>
    <body>       
        <div class="container">
            <h1>Hello Bootstrap</h1>           
              <table class="table">
                <thead>
                  <tr class="table-primary">
                    <th>Firstname</th>
                    <th>Lastname</th>
                    <th>Email</th>
                  </tr>
                </thead>
                <tbody>
                  <tr class="table-success">
                    <td>John</td>
                    <td>Doe</td>
                    <td>john@example.com</td>
                  </tr>
                  <tr class="table-danger">
                    <td>Mary</td>
                    <td>Moe</td>
                    <td>mary@example.com</td>
                  </tr>
                  <tr class="table-active">
                    <td>July</td>
                    <td>Dooley</td>
                    <td>july@example.com</td>
                  </tr>
                </tbody>
              </table>   
              <div class="row">               
                <div class="col-md-4">
                     <img src="./images/img7.jpg" width="100%" class="rounded" alt="No Image"></div>
                <div class="col-md-4">
                    <img src="./images/img8.jpg" width="100%" class="rounded-circle" alt="No Image"></div>
                <div class="col-md-4">
                    <img src="./images/img9.jpg" width="100%" class="img-thumbnail" alt="No Image"></div>                
              </div>
              
        </div>
    </body>
</html>
