<!DOCTYPE html>
<html>
    <head>
       <meta charset="utf-8">
       <title>Bootstrap Html</title>
       
       <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
       <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
       <script src="./js/bootstrap.min.js"></script>    
       <link rel="stylesheet" href="./css/bootstrap.min.css">
          
             
    </head>
    <body>       
        <div class="container">
            <h1>Hello Bootstrap</h1> 
            <ul class="pagination">
                <li class="page-item" data-target="previous" id="previous"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item" data-target="p1" id="p1"><a class="page-link" href="#">1</a></li>
                <li class="page-item" data-target="p2" id="p2"><a class="page-link" href="#">2</a></li>
                <li class="page-item" data-target="p3" id="p3"><a class="page-link" href="#">3</a></li>
                <li class="page-item" data-target="next" id="next"><a class="page-link" href="#">Next</a></li>
            </ul>
              
            <script>
                function start(){
                    var pages=$(".pagination>li");
                    console.log(pages);
                    $(".pagination>li").click(function(e){                         
                         e.preventDefault(); 
                         pages.each(function(index, element) {
                             $(element).removeClass('active');
                         });                  
                         var t=$(this).data("target");
                         $("#"+t).addClass("active");
                    });
                }

                $(document).ready(start);
            </script>
           
              
        </div>
    </body>
</html>
