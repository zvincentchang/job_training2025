<!DOCTYPE html>
<html>
    <head>
       <meta charset="utf-8">
       <title>Bootstrap Html</title>
       <link rel="stylesheet" href="./css/bootstrap.min.css">
       <script src="./js/bootstrap.min.js"></script>
       <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
       <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>       
    </head>
    <body>       
        <div class="container">
            <h1>Hello Bootstrap</h1> 
              <div class="row">               
                <div class="col-md-4">
                     <img src="./images/img7.jpg" width="100%" class="rounded" alt="No Image"></div>
                <div class="col-md-4">
                    <img src="./images/img8.jpg" width="100%" class="rounded-circle" alt="No Image"></div>
                <div class="col-md-4">
                    <img src="./images/img9.jpg" width="100%" class="img-thumbnail" alt="No Image"></div>                
              </div>
            <button class="btn btn-primary">Primary</button>
            <button class="btn btn-secondary">Secondary</button>
            <button class="btn btn-success">Success</button>
            <button class="btn btn-info">Info</button>
            <button class="btn btn-warning">Warning</button>
            <button class="btn btn-danger">Danger</button>
            <button class="btn btn-dark">Dark</button>
            <button class="btn btn-light">Light</button>
            <a href="#" class="btn btn-secondary">My  Anchor Link</a>
            <p></p>
            <button  class="btn btn-outline-primary">Primary</button>
            <button  class="btn btn-outline-secondary">Secondary</button>
            <button  class="btn btn-outline-success">Success</button>
            <button  class="btn btn-outline-info">Info</button>
            <button  class="btn btn-outline-warning">Warning</button>
            <button  class="btn btn-outline-danger">Danger</button>
            <p></p>
            <button class="btn btn-primary">
                <span class="spinner-border spinner-border-sm"></span>
            </button>
              <button class="btn btn-success">
                <span class="spinner-border spinner-border-sm"></span>
                Loading..
              </button>
              
        </div>
    </body>
</html>
