<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script src="https://cdn.staticfile.org/angular.js/1.8.1/angular.min.js"></script>
</head>

<body>

    <div ng-app="myApp" ng-controller="myCtrl" ng-init="quantity=1;price=5">
        名: <input type="text" ng-model="firstName"><br>
        姓: <input type="text" ng-model="lastName"><br>
        <br>
        姓名: {{firstName + " " + lastName}}
        <h2>價格計算機</h2>
        數量： <input type="number" ng-model="quantity">
        價格： <input type="number" ng-model="price">
        <p><b>總價：</b> {{ quantity * price }}</p>

    </div>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function ($scope) {
            $scope.firstName = "John";
            $scope.lastName = "Doe";
        });

    </script>


</body>

</html>
